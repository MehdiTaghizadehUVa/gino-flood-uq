flood: &FLOOD
  arch: 'gino'
  sample_max: 10000

  # Distributed computing
  distributed:
    use_distributed: False
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1
    seed: 123
    device: 'cuda:0'

  # Dataset related for training and one-step evaluation
  data:
    root: "/scratch/jrj6wm/New_Results"  # Single folder containing M80_XY.txt, etc.
    resolution: 32                      # Avoid KeyError if your code references config.data.resolution
    n_history: 3                       # Auto-regressive steps / history length
    batch_size: 1
    query_res: [48, 48]
    # Static & Dynamic file references for training
    static_files:
      - "M40_XY.txt"
      - "M40_CA.txt"
      - "M40_CE.txt"
      - "M40_CS.txt"
      - "M40_N.txt"
      - "M40_FA.txt"
      - "M40_A.txt"
      - "M40_CU.txt"
      - "M40_I.txt"
    dynamic_patterns:
      WD: "M80_WD_{}.txt"  # Water depth
      VX: "M80_VX_{}.txt"  # Velocity X
      VY: "M80_VY_{}.txt"  # Velocity Y
    boundary_patterns:
      inflow: "M80_US_InF_{}.txt"
    noise_type: "none"   # or "only_last", "correlated", "uncorrelated", "none"
    noise_std: [0.01, 0.001, 0.001]             # final-step standard deviation
    rollout_length: 36
    skip_before_timestep: 12

  # Rollout evaluation dataset related (using the same static and dynamic patterns as training)
  rollout_data:
    root: "/scratch/jrj6wm/New_Results/Test"  # Folder containing new hydrographs for rollout evaluation.
    static_files:
      - "M40_XY.txt"
      - "M40_CA.txt"
      - "M40_CE.txt"
      - "M40_CS.txt"
      - "M40_N.txt"
      - "M40_FA.txt"
      - "M40_A.txt"
      - "M40_CU.txt"
      - "M40_I.txt"
    dynamic_patterns:
      WD: "M10_WD_{}.txt"       # Ensure pattern matches file names in this folder.
      VX: "M10_VX_{}.txt"
      VY: "M10_VY_{}.txt"
    boundary_patterns:
      inflow: "M10_US_InF_{}.txt"

  # GINO architecture / hyperparameters
  gino:
    data_channels: 20                    # If you're not feeding direct input channels
    out_channels: 3                     # Predicting WD, VX, VY => 3
    latent_feature_channels: 0          # Adjust based on your feature concatenation
    gno_coord_dim: 2                    # 2D flood domain
    gno_radius: 0.1
    in_gno_transform_type: 'linear'
    out_gno_transform_type: 'linear'
    gno_pos_embed_type: None

    fno_n_modes: [16, 16]               # 2D domain => two dimensions
    fno_hidden_channels: 64
    fno_use_channel_mlp: True
    fno_norm: 'instance_norm'
    fno_ada_in_features: 16             # If using AdaIN-based normalization
    fno_factorization: 'tucker'
    fno_rank: 0.4
    fno_domain_padding: 0.1
    fno_channel_mlp_expansion: 1.0
    fno_resolution_scaling_factor: 1
    autoregressive: True

  # Optimization settings
  opt:
    n_epochs: 100
    learning_rate: 1e-3
    training_loss: 'l2'
    testing_loss: 'l2'
    weight_decay: 1e-4
    amp_autocast: False

    scheduler: 'StepLR'                # or 'CosineAnnealingLR', 'ReduceLROnPlateau'
    scheduler_T_max: 200               # for CosineAnnealingLR
    scheduler_patience: 5              # for ReduceLROnPlateau
    step_size: 50
    gamma: 0.5

  # Weights & Biases logging
  wandb:
    log: True
    name: null
    group: 'flood-experiments'
    project: 'Flood_GINO_Rivanna'
    entity: 'uva_mehdi'
    sweep: False
    log_output: True
    eval_interval: 1

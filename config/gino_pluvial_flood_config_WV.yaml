# All parameters used by flood_wv_train_operator.py are defined below.
# Override via CLI: --data.batch_size 32 --opt.n_epochs 20 etc.
# Quick overfit tests (200 samples, 20 epochs): --config_path config/gino_pluvial_flood_config_WV_overfit.yaml (L2) or .../gino_pluvial_flood_config_WV_overfit_crps.yaml (CRPS)
# Or override: --data.n_samples_max 200 --opt.n_epochs 20 --opt.training_loss l2
flood: &FLOOD
  arch: 'gino'
  sample_max: 10000

  # Distributed computing
  distributed:
    use_distributed: False
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1
    seed: 123
    device: 'cuda:0'

  # Reproducibility: deterministic=True sets CuDNN deterministic + all RNG seeds; same seed => same results
  deterministic: true

  # Dataset: HDF only. Geometry = Cell Points. Static = elevation + area (HDF) + CS, CU, FA (text)
  data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    resolution: 48
    n_history: 3
    batch_size: 128
    n_samples_max: null    # limit samples (set to null to use full dataset)
    query_res: [48, 48]
    train_txt: "train.txt"
    # Set to true to (over)write train.txt with all *\.hdf run IDs in data.root before building the dataset
    write_train_txt: true
    num_workers: 0         # DataLoader workers (0 = main process only; use >0 for faster loading)
    # Chunk size for streaming normalizer fit (samples per chunk; larger = fewer passes, more memory)
    normalizer_chunk_size: 10000
    # Path to save/load normalizer state (relative to data.root, or absolute). If set and file exists, load; else fit and save. Set to null to fit every time.
    normalizer_path: "normalizers.pt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"
    noise_type: "none"   # or "only_last", "correlated", "uncorrelated", "none"
    # Target variables to predict/input as dynamic history (subset of [wd, vx, vy], order matters)
    target_variables: ["wd", "vx", "vy"]
    # Noise std can be length 3 ([wd, vx, vy]) or length len(target_variables)
    noise_std: [0.01, 0.001, 0.001]             # final-step standard deviation
    rollout_length: 78
    skip_before_timestep: 12
    dt : 1200

  rollout_data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    test_txt: "test.txt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"

  # GINO architecture / hyperparameters
  gino:
    data_channels: 20   # overwritten at runtime: n_static (5) + n_history*1 + n_history*3
    # Static: elevation, area (HDF) + CS, CU, FA (text). Out: WD, VX, VY
    out_channels: 3                  # <--- changed from 3 to 4
    latent_feature_channels: 0
    projection_channels: 256
    gno_coord_dim: 2
    gno_radius: 0.1
    in_gno_transform_type: 'linear'
    out_gno_transform_type: 'linear'
    gno_pos_embed_type: None
    gno_embed_channels: 32
    gno_embed_max_positions: 10000
    in_gno_channel_mlp_hidden_layers: [80, 80, 80]
    out_gno_channel_mlp_hidden_layers: [512, 256]

    fno_n_modes: [16, 16]
    fno_hidden_channels: 64
    fno_lifting_channel_ratio: 2
    fno_n_layers: 4
    fno_use_channel_mlp: True
    # FGN (probabilistic): ada_in + use_fgn_noise for CRPS training
    fno_norm: 'ada_in'
    fno_ada_in_features: 16
    fno_ada_in_dim: 32             # must match fgn_noise_dim when use_fgn_noise: true
    use_fgn_noise: true
    fgn_noise_dim: 32
    fno_factorization: 'tucker'
    fno_rank: 0.4
    fno_joint_factorization: false
    fno_fixed_rank_modes: false
    fno_implementation: 'factorized'
    fno_domain_padding: 0.1
    fno_channel_mlp_expansion: 1.0
    fno_channel_mlp_dropout: 0.0
    fno_resolution_scaling_factor: 1
    autoregressive: True
    gno_in_weighting_fn: 'edam'
    gno_in_wt_fn_scale: 1.0
    gno_out_weighting_fn: 'edam'
    gno_out_wt_fn_scale: 1.0
    alpha:        1.0           # default residual update
    beta:         1.0

  checkpoint:
    save_dir: "./checkpoints_TargetOnly_FGN"
    resume_from_dir:  null  # set to path to resume (e.g. "./checkpoints_TargetOnly_FGN")

  rollout:
    run_after_training: false
    out_dir: "./rollout_gifs_Target_Only_N50_Source_WV"
    # Ensemble size for rollout (2+ for uncertainty; 1 = deterministic mean)
    n_ensemble_samples: 2

  # Set to true to run gradient-flow and overfit sanity checks before training (recommended if loss plateaus)
  verify_training: true

  # Eval in physical space (depth m, velocity m/s) for interpretable test_l2/test_crps
  inverse_test: true

  # Logging and progress
  log_level: 'INFO'           # DEBUG, INFO, WARNING, ERROR
  log_file: "training.log"    # path relative to checkpoint.save_dir, or null for default
  use_progress_bar: true      # show tqdm progress bar over training batches

  # Optimization settings
  opt:
    n_epochs: 150
    learning_rate: 1e-3
    # AR fine-tuning: single-step until ar_finetune_start_epoch, then curriculum AR up to ar_rollout_steps
    ar_finetune_start_epoch: 50   # start AR after 10 epochs of single-step CRPS
    ar_rollout_steps: 8
    ar_curriculum_epochs_per_step: 2   # 2 epochs at 1 step, then 2 at 2 steps, ... up to 8
    training_loss: 'crps'
    crps_n_samples: 2   # number of ensemble members for CRPS (>= 2; more = better score, higher cost)
    crps_l2_weight: 0.0   # CRPS + rel L2(mean, y); set > 0 for stability
    crps_channel_weights: [1.0, 1.0, 1.0]   # emphasize water depth (WD), downweight vx, vy
    flood_crps_spatial_weights: false   # area weighting + soft wet/dry masking
    wet_threshold: 0.01
    wet_smooth_scale: 0.02
    dry_weight_alpha: 0.1
    hazard_proxy_crps: false   # pooled hazard proxy (depth * velocity²) for flood-relevant uncertainty
    hazard_proxy_crps_weight: 0.15   # ~10–30% of total loss
    ar_pooled_crps_gamma: 0.95   # slight emphasis on later rollout steps
    testing_loss: 'l2'
    weight_decay: 1e-4
    amp_autocast: False

    # Scheduler options: 'StepLR', 'CosineAnnealingLR', 'ReduceLROnPlateau'
    scheduler: 'ReduceLROnPlateau'
    # For ReduceLROnPlateau: monitor 'train_err' or 'avg_loss' (both epoch means)
    scheduler_monitor: 'avg_loss'
    scheduler_mode: 'min'
    scheduler_patience: 5
    scheduler_threshold: 1e-4
    scheduler_threshold_mode: 'rel'
    scheduler_cooldown: 0
    scheduler_min_lr: 0.0
    # For CosineAnnealingLR
    scheduler_T_max: 200
    scheduler_eta_min: 0.0
    # For StepLR
    step_size: 50
    gamma: 0.5

  # Weights & Biases logging (set log: True and set WANDB_API_KEY to enable)
  # eval_interval: how often to run evaluation and log (every N epochs)
  wandb:
    log: false
    name: null
    group: 'flood-experiments'
    project: 'Flood_GINO_NoPhysics'
    entity: 'uva_mehdi'
    sweep: false
    log_output: true
    eval_interval: 1
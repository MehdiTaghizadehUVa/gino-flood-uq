# Config for GINO trained WITHOUT FGN (deterministic L2). Use with checkpoints_TargetOnly.
# Same as gino_pluvial_flood_config_WV.yaml except: use_fgn_noise: false, training_loss: l2, save_dir: checkpoints_TargetOnly.
flood: &FLOOD
  arch: 'gino'
  sample_max: 10000

  distributed:
    use_distributed: False
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1
    seed: 123
    device: 'cuda:0'

  deterministic: true

  data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    resolution: 48
    n_history: 3
    batch_size: 128
    n_samples_max: null
    query_res: [48, 48]
    train_txt: "train.txt"
    write_train_txt: true
    num_workers: 0
    normalizer_chunk_size: 10000
    normalizer_path: "normalizers.pt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"
    noise_type: "none"
    # Target variables to predict/input as dynamic history (subset of [wd, vx, vy], order matters)
    target_variables: ["wd", "vx", "vy"]
    # Noise std can be length 3 ([wd, vx, vy]) or length len(target_variables)
    noise_std: [0.01, 0.001, 0.001]
    rollout_length: 78
    skip_before_timestep: 12
    dt : 1200

  rollout_data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    test_txt: "test.txt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"

  gino:
    data_channels: 20   # overwritten at runtime
    out_channels: 3
    latent_feature_channels: 0
    projection_channels: 256
    gno_coord_dim: 2
    gno_radius: 0.1
    in_gno_transform_type: 'linear'
    out_gno_transform_type: 'linear'
    gno_pos_embed_type: None
    gno_embed_channels: 32
    gno_embed_max_positions: 10000
    in_gno_channel_mlp_hidden_layers: [80, 80, 80]
    out_gno_channel_mlp_hidden_layers: [512, 256]

    fno_n_modes: [16, 16]
    fno_hidden_channels: 64
    fno_lifting_channel_ratio: 2
    fno_n_layers: 4
    fno_use_channel_mlp: True
    fno_norm: 'instance_norm'          # no AdaIN (checkpoints_TargetOnly was trained without FGN/ada_in)
    fno_ada_in_features: 16
    fno_ada_in_dim: 32
    use_fgn_noise: false    # no FGN: deterministic model
    fgn_noise_dim: 32
    fno_factorization: 'tucker'
    fno_rank: 0.4
    fno_joint_factorization: false
    fno_fixed_rank_modes: false
    fno_implementation: 'factorized'
    fno_domain_padding: 0.1
    fno_channel_mlp_expansion: 1.0
    fno_channel_mlp_dropout: 0.0
    fno_resolution_scaling_factor: 1
    autoregressive: True
    gno_in_weighting_fn: 'edam'
    gno_in_wt_fn_scale: 1.0
    gno_out_weighting_fn: 'edam'
    gno_out_wt_fn_scale: 1.0
    alpha: 1.0
    beta: 1.0

  checkpoint:
    save_dir: "./checkpoints_TargetOnly"
    resume_from_dir: null

  rollout:
    run_after_training: false
    out_dir: "./rollout_gifs_Target_Only_WV"
    n_ensemble_samples: 1

  verify_training: true
  inverse_test: true

  log_level: 'INFO'
  log_file: "training.log"
  use_progress_bar: true

  opt:
    n_epochs: 150
    learning_rate: 1e-3
    ar_finetune_start_epoch: 150
    ar_rollout_steps: 8
    ar_curriculum_epochs_per_step: 2
    training_loss: 'l2'    # deterministic L2 (no CRPS)
    testing_loss: 'l2'
    weight_decay: 1e-4
    amp_autocast: False

    scheduler: 'ReduceLROnPlateau'
    scheduler_monitor: 'avg_loss'
    scheduler_T_max: 200
    scheduler_patience: 5
    step_size: 50
    gamma: 0.5

  wandb:
    log: false
    name: null
    group: 'flood-experiments'
    project: 'Flood_GINO_NoPhysics'
    entity: 'uva_mehdi'
    sweep: false
    log_output: true
    eval_interval: 1

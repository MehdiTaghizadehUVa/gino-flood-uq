# Water-depth-only version of the WV config.
# Predicts WD only via data.target_variables: ["wd"].
flood: &FLOOD
  arch: 'gino'
  sample_max: 10000

  distributed:
    use_distributed: False
    # Runtime launcher hint for job scripts; training code reads use_distributed + torchrun env.
    launch_mode: 'single'
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1
    seed: 123
    device: 'cuda:0'

  deterministic: true

  data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    resolution: 48
    n_history: 3
    batch_size: 128
    n_samples_max: null
    query_res: [48, 48]
    train_txt: "train.txt"
    write_train_txt: true
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 1
    normalizer_chunk_size: 10000
    normalizer_path: "normalizers_depth_only.pt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"
    noise_type: "none"
    target_variables: ["wd"]
    noise_std: [0.01]
    rollout_length: 78
    skip_before_timestep: 12
    dt : 1200

  rollout_data:
    root: "C:/Users/jrj6wm/Desktop/Data_Generation_UQ/Results/M40"
    test_txt: "test.txt"
    static_text_files:
      - "M40_CS.txt"
      - "M40_CU.txt"
      - "M40_FA.txt"

  gino:
    data_channels: 20   # overwritten at runtime
    out_channels: 1     # overwritten from target_variables at runtime
    latent_feature_channels: 0
    projection_channels: 256
    gno_coord_dim: 2
    gno_radius: 0.1
    in_gno_transform_type: 'linear'
    out_gno_transform_type: 'linear'
    gno_pos_embed_type: None
    gno_embed_channels: 32
    gno_embed_max_positions: 10000
    in_gno_channel_mlp_hidden_layers: [80, 80, 80]
    out_gno_channel_mlp_hidden_layers: [512, 256]

    fno_n_modes: [16, 16]
    fno_hidden_channels: 64
    fno_lifting_channel_ratio: 2
    fno_n_layers: 4
    fno_use_channel_mlp: True
    fno_norm: 'ada_in'
    fno_ada_in_features: 16
    fno_ada_in_dim: 32
    # Probabilistic output mode:
    # - deterministic: standard point prediction (works with l2/l2_abs or FGN+crps)
    # - gaussian: packed [mu, logvar] output (requires opt.training_loss: gaussian_nll and use_fgn_noise: false)
    output_distribution: 'deterministic'
    use_fgn_noise: true
    fgn_noise_dim: 32
    fno_factorization: 'tucker'
    fno_rank: 0.4
    fno_joint_factorization: false
    fno_fixed_rank_modes: false
    fno_implementation: 'factorized'
    fno_domain_padding: 0.1
    fno_channel_mlp_expansion: 1.0
    fno_channel_mlp_dropout: 0.0
    fno_resolution_scaling_factor: 1
    autoregressive: True
    gno_in_weighting_fn: 'edam'
    gno_in_wt_fn_scale: 1.0
    gno_out_weighting_fn: 'edam'
    gno_out_wt_fn_scale: 1.0
    alpha: 1.0
    beta: 1.0

  checkpoint:
    save_dir: "./checkpoints_WV_depth_only_FGN"
    resume_from_dir:  null

  rollout:
    run_after_training: false
    out_dir: "./rollout_gifs_WV_depth_only"
    n_ensemble_samples: 2

  verify_training: true
  inverse_test: true

  log_level: 'INFO'
  log_file: "training.log"
  use_progress_bar: true

  opt:
    n_epochs: 150
    learning_rate: 1e-4
    ar_finetune_start_epoch: 100
    ar_rollout_steps: 8
    ar_curriculum_epochs_per_step: 25
    # AR gradient policy:
    # - full: full BPTT across rollout
    # - adaptive: full first, retry failed OOM batches with truncated BPTT
    # - truncated: always detach every ar_truncation_steps
    ar_gradient_mode: 'adaptive'
    ar_truncation_steps: 1
    # Training loss options: 'l2', 'l2_abs', 'crps' (FGN), 'gaussian_nll' (Gaussian head)
    training_loss: 'crps'
    crps_n_samples: 2
    crps_sample_chunk_size: 1
    crps_l2_weight: 0.0
    crps_channel_weights: [1.0]   # single channel (WD)
    gaussian_min_logvar: -9.0
    gaussian_max_logvar: 4.0
    gaussian_logvar_reg_weight: 1.0e-6
    flood_crps_spatial_weights: false
    wet_threshold: 0.01
    wet_smooth_scale: 0.02
    dry_weight_alpha: 0.1
    hazard_proxy_crps: false
    hazard_proxy_crps_weight: 0.15
    ar_pooled_crps_gamma: 0.95
    testing_loss: 'l2'
    weight_decay: 1e-4
    amp_autocast: True
    grad_accum_steps: 1
    use_activation_checkpointing: false

    # Scheduler options: 'StepLR', 'CosineAnnealingLR', 'ReduceLROnPlateau'
    scheduler: 'ReduceLROnPlateau'
    # For ReduceLROnPlateau: monitor 'train_err' or 'avg_loss' (both epoch means)
    scheduler_monitor: 'avg_loss'
    scheduler_mode: 'min'
    scheduler_patience: 5
    scheduler_threshold: 1e-4
    scheduler_threshold_mode: 'rel'
    scheduler_cooldown: 0
    scheduler_min_lr: 0.0
    # For CosineAnnealingLR
    scheduler_T_max: 200
    scheduler_eta_min: 0.0
    # For StepLR
    step_size: 50
    gamma: 0.5

  wandb:
    log: false
    name: null
    group: 'flood-experiments'
    project: 'Flood_GINO_NoPhysics'
    entity: 'uva_mehdi'
    sweep: false
    log_output: true
    eval_interval: 1

# NEON-aligned Stage-2 epistemic FGNO configuration (coastal depth-only v1).
#
# This is an offline research/training extension. It does NOT change Stage-1
# FGNO training. Point `stage1_checkpoint_dir` at a pretrained coastal FGNO run
# and `stage2_checkpoint_dir` at the desired Stage-2 output directory.
#
# The `neon:` block is parsed by neuralop.flood.neon_config.load_neon_config.
neon:
  enabled: true
  stage1_checkpoint_dir: /path/to/pretrained_fgno
  stage2_checkpoint_dir: /path/to/neon_stage2

  # Feature seam exposed from the frozen GINO forward path.
  # One of: decoder_pre_projection | latent_grid_fno | combined_mesh
  feature_source: decoder_pre_projection

  # Correction dependency on the aleatory hydraulic state.
  # za_dependent (main method) | za_independent (ablation)
  dependency: za_dependent

  # Epistemic index dimension and nested ensemble budgets.
  d_e: 16
  M_train: 4
  K_train: 8
  M_eval: 16
  K_eval: 50

  # Randomized-prior scale. `auto_0p10_base_rmse` calibrates alpha so that
  # Std_ze[alpha * E^P] ~= 0.10 * RMSE_base on a calibration batch. Set `alpha`
  # to a float to pin it explicitly (overrides auto-calibration).
  prior_scale: auto_0p10_base_rmse
  alpha: null

  # EpiNet branch architecture. `projected` is the NEON-aligned default;
  # `film` keeps the older FiLM/AdaIN branch available as an ablation.
  branch_type: projected
  train_hidden_channels: 16
  prior_hidden_channels: 16
  branch_layers: 2
  branch_activation: gelu
  concat_index: false

  # Population-centered low-rank epistemic basis. Stored projection vectors,
  # not regeneration from the seed, define checkpoint behavior.
  epistemic_basis: hermite_random_projection
  epistemic_linear_terms: true
  epistemic_quadratic_terms: 16
  epistemic_basis_seed: 123
  epistemic_index_mode: continuous
  dirichlet_num_particles: 16
  dirichlet_particle_seed: 123

  # The deterministic Stage-2 mean correction is conditioned on a fixed
  # antithetic Stage-1 latent bank, independent of K_train/K_eval.
  deterministic_head: true
  deterministic_head_feature: canonical_aleatory_mean
  deterministic_head_canonical_k: 32
  deterministic_head_latent_seed: 123

  # Index-dependent family views. Probit-exponential weights break the even-z
  # symmetry that otherwise encourages cancellation of the odd prior branch.
  bootstrap:
    enabled: true
    distribution: probit_exponential
    temperature: 0.5
    normalize: per_epistemic_batch
    min_weight: 0.05
    max_weight: 5.0
    seed: 0

  member_bootstrap:
    # Reference members represent aleatory simulator uncertainty and are not
    # resampled as epistemic observations in the main method.
    enabled: false
    temperature: 1.0
    seed: 1

  # Prior-only random Fourier features make the fixed prior branch see mesh
  # coordinate/lead-time structure that the trainable branch cannot cancel
  # exactly. Set prior_rff_dim: 0 for legacy projected-branch behavior.
  prior_rff_dim: 0
  prior_rff_lengthscale: 0.25
  prior_rff_include_lead: true

  # Checkpoint selection uses validation fit only among epochs with retained
  # randomized-prior variance above this floor. Set 0.0 for legacy selection.
  selection_min_retention: 0.0
  selection_rmse_margin_m: 0.001
  selection_metric: mixture_crps
  selection_enforce_rmse: true

  # Auto alpha calibration probes several families with at least 64 epistemic
  # indices to reduce the noisy one-family / M_train estimate.
  calibration_families: 4
  calibration_m: 64

  cancellation_diagnostics:
    enabled: true
    warn_cosine_below: -0.90
    warn_cancellation_above: 0.80

  # Objective. per_epistemic_fcrps is the main method; pooled_fcrps is the
  # negative-control ablation; l2_mean is the conditional-mean baseline.
  objective: per_epistemic_fcrps
  reference_term_for_logging: true

  # Scoring weights.
  spatial_weights: wettable_area   # wettable_area | wet_front | uniform
  lead_time_weights: uniform       # uniform | lead_emphasis

  # Native EpiNet/NEON objective uses the fit loss with randomized priors and
  # bootstrap-indexed data views. Flood-specific penalties are opt-in ablations.
  lambda_rpf: 0.0
  lambda_smooth: 0.0
  lambda_time: 0.0
  lambda_pos: 0.0
  lambda_mag: 0.0

  # Optimizer.
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  n_epochs: 30
  # Set >1 to reduce expensive full-validation cache reads; the final epoch
  # is always validated regardless of this interval.
  validation_interval: 1

  # Overlap bounded GPFS feature-cache reads with GPU work. Bank selection is
  # generated by an isolated, epoch-specific RNG so prefetching cannot perturb
  # epistemic-index or reference-member draws.
  feature_prefetch_workers: 2
  feature_prefetch_depth: 2

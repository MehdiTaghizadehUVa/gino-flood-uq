flood: &FLOOD
  arch: 'gino'
  sample_max: 10000

  model:
    anchored_low_rank:
      enabled: true
      num_particles: 4
      rank: 4
      anchor_seed: 20260724
      anchor_relative_norm: 0.01
      anchor_penalty_weight: 1.0e-3
      fno_last_n_blocks: 2
      adapt_spectral: true
      adapt_pointwise: true
      adapt_output_gno: true
      adapt_output_projection: true
      adapt_forcing_encoder: false

  training:

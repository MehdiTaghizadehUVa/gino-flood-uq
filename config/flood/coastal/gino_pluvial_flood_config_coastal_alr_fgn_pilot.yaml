      bootstrap: dirichlet_family
      bootstrap_seed: 20260724
      family_split_seed: 123
      validation_family_count: 50
      train_family_limit: 450
      adapter_warmup_epochs: 5
      joint_finetune_epochs: 25
      adapter_learning_rate: 1.0e-4
      backbone_learning_rate: 1.0e-5
      rmse_noninferiority_margin: 0.001
      k_train: 2
      eval_member_chunk_size: 16
      k_eval: 15
      stage1_checkpoint_dir: "/sfs/gpfs/tardis/home/jrj6wm/GINO_Model/neuraloperator_no_physics_git_main/scripts/runtime/coastal_full_train_wvlike250/coastal_trial0035_wvlike_bs128_r48_det_a100_lr5e4_h128_uqgroup_20260407_110945_3af9ccf/checkpoint"

  distributed:
    use_distributed: False
    launch_mode: 'single'
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 1
    seed: 123
    device: 'cuda:0'

  deterministic: false

  data:
    root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/results/coastal/Coastal_Flood_coastal_v1_5k_train_prod_t2_w64_20260318_233556/train"
    normalizer_root: "/sfs/gpfs/tardis/home/jrj6wm/GINO_Model/neuraloperator_no_physics_git_main/scripts/runtime/coastal_full_train_wvlike250/coastal_trial0035_wvlike_bs128_r48_det_a100_lr5e4_20260406_172705_3af9ccf/artifacts"
    normalizer_path: "normalizers_depth_only.pt"
    boundary:
      channels:
        - name: stage
          mode: clean_family
          clean_boundary_root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/synthetic/coastal/dynamic_v1_5k"
          clean_boundary_file: "Stage_Hydrographs_Train_Clean.txt"
        - name: precipitation
          mode: clean_family
          clean_boundary_root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/synthetic/coastal/dynamic_v1_5k"
          clean_boundary_file: "Precipitation_Train_Clean.txt"
    hdf_paths:
      geometry_cell_centers: "Geometry/2D Flow Areas/Portsmouth/Cells Center Coordinate"
      elevation: "Geometry/2D Flow Areas/Portsmouth/Cells Minimum Elevation"
      area: "Geometry/2D Flow Areas/Portsmouth/Cells Surface Area"
      wd: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Hydraulic Depth"
      vx: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Velocity - Velocity X"
      vy: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Velocity - Velocity Y"
    resolution: 48
    n_history: 3
    batch_size: 16
    n_samples_max: null
    query_res: [48, 48]
    train_txt: "train.txt"
    write_train_txt: true
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 1
    normalizer_chunk_size: 10000
    static_text_files:
      - "Coastal_Slope.txt"
      - "Coastal_Aspect.txt"
      - "Coastal_FlowDirection.txt"
      - "Coastal_Curvature.txt"
      - "Coastal_FlowAccumulation.txt"
    noise_type: "none"
    target_variables: ["wd"]
    noise_std: [0.01]
    rollout_length: -1
    skip_before_timestep: 12
    dt: 900

  rollout_data:
    root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/results/coastal/Coastal_Flood_coastal_v1_5k_train_prod_t2_w64_20260318_233556/train"
    boundary:
      channels:
        - name: stage
          mode: clean_family
          clean_boundary_root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/synthetic/coastal/dynamic_v1_5k"
          clean_boundary_file: "Stage_Hydrographs_Train_Clean.txt"
        - name: precipitation
          mode: clean_family
          clean_boundary_root: "/scratch/jrj6wm/uncertainty_floodmodel_linux/synthetic/coastal/dynamic_v1_5k"
          clean_boundary_file: "Precipitation_Train_Clean.txt"
    hdf_paths:
      geometry_cell_centers: "Geometry/2D Flow Areas/Portsmouth/Cells Center Coordinate"
      elevation: "Geometry/2D Flow Areas/Portsmouth/Cells Minimum Elevation"
      area: "Geometry/2D Flow Areas/Portsmouth/Cells Surface Area"
      wd: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Hydraulic Depth"
      vx: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Velocity - Velocity X"
      vy: "Results/Unsteady/Output/Output Blocks/Base Output/Unsteady Time Series/2D Flow Areas/Portsmouth/Cell Velocity - Velocity Y"
    test_txt: "train.txt"
    static_text_files:
      - "Coastal_Slope.txt"
      - "Coastal_Aspect.txt"
      - "Coastal_FlowDirection.txt"
      - "Coastal_Curvature.txt"
      - "Coastal_FlowAccumulation.txt"

  structural_dry:
    policy: "legacy_full_domain"
    mask_path: null
    mask_definition: "exact_zero"
    canonical_data_root: null
    canonical_train_txt: null
    report_full_domain_secondary: true
    report_dry_background_secondary: true

  gino:
    data_channels: 20
    out_channels: 1
    latent_feature_channels: 0
    projection_channels: 256
    gno_coord_dim: 2
    gno_radius: 0.1
    in_gno_transform_type: 'linear'
    out_gno_transform_type: 'linear'
    gno_pos_embed_type: null
    gno_embed_channels: 32
    gno_embed_max_positions: 10000
    in_gno_channel_mlp_hidden_layers: [80, 80, 80]
    out_gno_channel_mlp_hidden_layers: [512, 256]
    fno_n_modes: [16, 16]
    fno_hidden_channels: 128
    fno_lifting_channel_ratio: 2
    fno_n_layers: 4
    fno_use_channel_mlp: True
    fno_norm: 'ada_in'
    fno_ada_in_features: 16
    fno_ada_in_dim: 32
    output_distribution: 'deterministic'
    use_fgn_noise: true
    fgn_noise_dim: 32
    fgn_latent_temporal_mode: 'persistent'
    fno_factorization: 'tucker'
    fno_rank: 0.4
    fno_joint_factorization: false
    fno_fixed_rank_modes: false
    fno_implementation: 'factorized'
    fno_domain_padding: 0.1
    fno_channel_mlp_expansion: 1.0
    fno_channel_mlp_dropout: 0.0
    fno_resolution_scaling_factor: 1
    autoregressive: True
    gno_in_weighting_fn: 'edam'
    gno_in_wt_fn_scale: 1.0
    gno_out_weighting_fn: 'edam'
    gno_out_wt_fn_scale: 1.0
    alpha: 1.0
    beta: 1.0

  checkpoint:
    save_dir: "./checkpoints_coastal_alr_fgn_pilot"
    resume_from_dir: null
    save_every: 1
    save_best_metric: "test_crps"

  rollout:
    run_after_training: false
    out_dir: "./rollout_outputs_coastal_alr_fgn_pilot"
    n_ensemble_samples: 60
    init_mode: "mean_history"
    alr_aleatory_samples: 15
    forecast_artifact_dir: "./rollout_outputs_coastal_alr_fgn_pilot/forecast_artifacts/test_raw"
    write_visualizations: false

  verify_training: false
  inverse_test: true

  log_level: 'INFO'
  log_file: "training.log"
  use_progress_bar: true

  opt:
    n_epochs: 30
    learning_rate: 5e-4
    ar_finetune_start_epoch: 5
    ar_rollout_steps: 5
    ar_curriculum_epochs_per_step: 5
    ar_gradient_mode: 'adaptive'
    ar_truncation_steps: 1
    training_loss: 'crps'
    fgn_ar_state_update: 'member_feedback'
    crps_n_samples: 2
    crps_sample_chunk_size: 1
    crps_l2_weight: 0.0
    crps_channel_weights: [1.0]
    gaussian_min_logvar: -9.0
    gaussian_max_logvar: 4.0
    gaussian_logvar_reg_weight: 1.0e-6
    flood_crps_spatial_weights: false
    wet_threshold: 0.01
    wet_smooth_scale: 0.02
    dry_weight_alpha: 0.1
    hazard_proxy_crps: false
    hazard_proxy_crps_weight: 0.15
    ar_pooled_crps_gamma: 0.95
    testing_loss: 'l2'
    weight_decay: 1e-4
    amp_autocast: True
    grad_accum_steps: 1
    use_activation_checkpointing: false
    scheduler: 'ReduceLROnPlateau'
    scheduler_monitor: 'avg_loss'
    scheduler_mode: 'min'
    scheduler_patience: 5
    scheduler_threshold: 1e-4
    scheduler_threshold_mode: 'rel'
    scheduler_cooldown: 0
    scheduler_min_lr: 0.0
    scheduler_T_max: 200
    scheduler_eta_min: 0.0
    step_size: 50
    gamma: 0.5

  visualization:
    map:
      enabled: true
      crs: "EPSG:32618"
      mode: "dem_elevation"  # topo | imagery | 3dep_hillshade | elevation_hillshade | dem_elevation
      provider: "local_elevation"
      dem_cmap: "hecras_dem"
      dem_quantiles: [0.01, 0.99]
      cache_scope: "run_extent"
      fallback: "elevation_hillshade"
    wd:
      colormap: "cyan_depth"
      overlay_alpha: 0.88
      show_wet_edge: false
      wet_edge_threshold_m: 0.05
    diagnostics:
      zero_threshold: 1.0e-10
      zero_fraction: 0.03
      overlay_alpha: 0.70
      basemap_alpha: 0.28
      error_colormap: "error_rose_alpha_ramp"
      spread_colormap: "spread_violet_alpha_ramp"
      crps_colormap: "crps_indigo_alpha_ramp"
    time:
      display: "forecast_horizon_after_spinup"
      initial_history_steps: 3
    output:
      write_gif: true
      write_mp4: true

  wandb:
    log: false
    name: null
    group: 'coastal-alr-fgno-pilot'
    project: 'Flood_GINO_NoPhysics'
    entity: 'uva_mehdi'
    sweep: false
    log_output: true
    eval_interval: 1

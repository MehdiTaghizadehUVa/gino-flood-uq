name: Build documentation
# Action adapted from https://github.com/tensorly/tensorly

on:
  pull_request:
    paths:
      - "doc/**"
      - "neuralop/**"
      - "pyproject.toml"
      - ".github/workflows/build_doc_dev.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # torchtnt imports pkg_resources; keep setuptools that still ships it.
        python -m pip install "setuptools<81"
        # Keep docs environment on a known-compatible CPU torch stack.
        python -m pip install "torch==2.5.1" "torchvision==0.20.1" --index-url https://download.pytorch.org/whl/cpu
    - name: Install package
      run: |
        python -m pip install -e ".[doc]"
    - name: Make doc
      run: |
        cd doc
        make html
        cd ..
    - name: Push docs on main update
      if: success() && github.ref == 'refs/heads/main' && github.repository == 'neuraloperator/neuraloperator' && secrets.DOC_DEPLOY_PRIVATE_KEY != ''
      run: |
        # Add deploy key and clone through ssh
        eval "$(ssh-agent -s)"
        mkdir -p ~/.ssh
        echo "${{ secrets.DOC_DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
        echo 'Documentation was successfully built, updating the website.'
        # See https://github.community/t/github-actions-bot-email-address/17204/5
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions"
        git clone "git@github.com:neuraloperator/neuraloperator.github.io.git" doc_folder
        echo "-- Updating the content"
        cd doc_folder
        git rm -r dev/*
        mkdir -p dev
        echo "Copying to folder"
        cp -r ../doc/build/html/* dev/
        echo "Pushing to git"
        git add dev
        git commit -m "Github action: auto-update."
        git push --force origin main

name: FGN Serving Images

on:
  workflow_run:
    workflows: ["FGN Serving CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "python_tags<<EOF"
            echo "${namespace}/fgn-serving-python:${sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "${namespace}/fgn-serving-python:main"
            fi
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "${namespace}/fgn-serving-frontend:${sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "${namespace}/fgn-serving-frontend:main"
            fi
            echo "EOF"
            echo "proxy_tags<<EOF"
            echo "${namespace}/fgn-serving-proxy:${sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "${namespace}/fgn-serving-proxy:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Python serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/fgn-serving/python.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.python_tags }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/fgn-serving-frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/fgn-serving/proxy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.proxy_tags }}

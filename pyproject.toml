[project]
name = "neuraloperator"
description = "NeuralOperator: Learning in Infinite Dimensions"
authors = [
    {name = "Jean Kossaifi <jean.kossaifi@gmail.com>, David Pitt <david.h.pitt@gmail.com>, Nik Kovachki, Zongyi Li", email="david.h.pitt@gmail.com"},
]
dependencies = [
    "wandb",
    "ruamel-yaml",
    "configmypy",
    "tensorly",
    "tensorly-torch",
    "torch-harmonics==0.7.4",
    "matplotlib",
    "numpy>=1.25",
    "opt-einsum",
    "h5py",
    "zarr",
    "optuna",
]
requires-python = ">=3.9"
readme = "README.rst"
license = {text = "MIT"}

# Dynamic versioning
dynamic = ["version"]

# Required config for build system
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "neuralop",
    "neuralop.*",    
]

# Dynamic versioning from neuralop.__init__
[tool.setuptools.dynamic]
version = {attr = "neuralop.__version__"}

[project.scripts]
neuralop-flood-train-operator = "neuralop.flood.cli.train_operator:main"
neuralop-flood-train-diffusion = "neuralop.flood.cli.train_diffusion:main"
neuralop-flood-eval-operator = "neuralop.flood.eval.common:main"
neuralop-flood-eval-operator-calibrated = "neuralop.flood.eval.calibrated:main"
neuralop-flood-eval-diffusion = "neuralop.flood.eval.diffusion:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "flaky",
    "black"
]
doc = [
    "matplotlib",
    "myst-nb",
    "numpydoc",
    "numpy>=1.25",
    "sphinx",
    "sphinx-gallery",
    "tensorly_sphinx_theme",
    "torchtnt",
]
geo = [
    "pyproj",
    "contextily",
    "rasterio",
    "xyzservices",
]
all = [
    "pytest",
    "flaky",
    "black",
    "matplotlib",
    "myst-nb",
    "numpydoc",
    "sphinx",
    "sphinx-gallery",
    "tensorly_sphinx_theme",
    "torchtnt",
    "numpy>=1.25",
    "scipy",
]
